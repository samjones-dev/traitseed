[project]
name = "traitseed"
version = "0.1.0"
description = "Curated trait lattices for varied, coherent LLM data generation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "synthetic-data", "data-generation", "diversity", "personas"]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/samjones-dev/traitseed"
Writeup = "https://github.com/samjones-dev/traitseed/blob/main/WRITEUP.md"

[dependency-groups]
ablation = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traitseed"]

# probes/ and ablation/ are research artifacts (~5MB); the package
# itself is src/ + tests/. Keep the sdist to what a build needs.
[tool.hatch.build.targets.sdist]
exclude = ["probes", "ablation", "uv.lock"]
